<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 22 400 400">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#10233d"/>
      <stop offset="0.55" stop-color="#070d18"/>
      <stop offset="1" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff4ff"/>
      <stop offset="0.5" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#c13dff"/>
    </linearGradient>
    <radialGradient id="core" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#8ff7ff"/>
      <stop offset="0.7" stop-color="#2aa8ff"/>
      <stop offset="1" stop-color="#1340b8"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="frontHalf"><rect x="0" y="222" width="512" height="300"/></clipPath>
  </defs>
  
  
  <!-- halo -->
  <circle cx="256" cy="222" r="96" fill="#2aa8ff" opacity="0.35" filter="url(#soft)"/>
  <!-- back half of orbit -->
  <ellipse cx="256" cy="222" rx="176" ry="58" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.45" transform="rotate(-18 256 222)"/>
  <!-- planet core -->
  <circle cx="256" cy="222" r="74" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="256" cy="222" r="74" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <!-- front half of orbit (passes in front of the core) -->
  <g clip-path="url(#frontHalf)" transform="rotate(-18 256 222)">
    <ellipse cx="256" cy="222" rx="176" ry="58" fill="none" stroke="url(#ring)" stroke-width="12" filter="url(#glow)"/>
  </g>
  <!-- satellite -->
  <circle cx="404" cy="214" r="15" fill="#ffffff" filter="url(#glow)" transform="rotate(-18 256 222)"/>
  
</svg>
